name: TextLauncher
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  TextLauncher:
    type: application
    platform: iOS
    sources:
      - TextLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: internal.textlauncher
        PRODUCT_NAME: TextLauncher
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Text Launcher"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  TextLauncher:
    build:
      targets:
        TextLauncher: all
