name: Temporary TextLauncher IPA Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-textlauncher:
    if: github.head_ref == 'textlauncher-ipa-build'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd TextLauncherBuild
          xcodegen generate

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd TextLauncherBuild
          xcodebuild \
            -project TextLauncher.xcodeproj \
            -scheme TextLauncher \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf Payload TextLauncher-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry TextLauncher-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TextLauncher-unsigned-ipa
          path: TextLauncherBuild/TextLauncher-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
